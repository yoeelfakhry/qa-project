model_name: albert_base_fine_tuned
checkpoint: albert/albert-base-v2

data_csv: data/SQuAD-v1.1.csv
n_rows: 10000
seed: 42

max_length: 384
doc_stride: 128
max_answer_length: 30
n_best: 20

learning_rate: 2.0e-5
train_batch_size: 8
eval_batch_size: 8
num_train_epochs: 3
weight_decay: 0.01
warmup_ratio: 0.06

output_dir: outputs/albert_qa
final_model_dir: saved_models/albert_qa_best
